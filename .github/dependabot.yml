# Dependabot version updates. Every PR it opens is reviewed by hand like any
# other change and is never auto-merged (CLAUDE.md §18).
# The uv entry reads pyproject.toml + uv.lock (the only manifest since v1.14).
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
