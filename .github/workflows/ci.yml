name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Syntax & static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install only the deps needed for static analysis (fast).
      # Full yfinance / numba stack is skipped here — it's slow to install
      # and not needed for syntax/import checks.
      - name: Install analysis dependencies
        run: pip install pyflakes

      # Hard gate: AST parse every Python file. Catches syntax errors that
      # would crash the server on startup. No interpreter quirks — pure grammar.
      - name: Python syntax check (all .py files)
        run: |
          python -c "
          import ast, sys, pathlib, os
          errors = []
          for p in pathlib.Path('.').rglob('*.py'):
            if any(part.startswith('.') for part in p.parts):
              continue  # skip .venv, __pycache__, etc.
            try:
              ast.parse(p.read_text(encoding='utf-8'))
            except SyntaxError as e:
              errors.append(f'{p}:{e.lineno}: {e.msg}')
          if errors:
            print('Syntax errors found:')
            for e in errors: print(' ', e)
            sys.exit(1)
          print(f'Syntax OK — checked {len(list(pathlib.Path(\".\").rglob(\"*.py\")))} files')
          "

      # Pyflakes catches undefined names, unused imports, etc.
      - name: Pyflakes on package modules
        run: |
          python -m pyflakes portfolio_tracker/cache.py portfolio_tracker/helpers.py portfolio_tracker/persistence.py portfolio_tracker/resolver.py portfolio_tracker/fx.py portfolio_tracker/fetcher.py portfolio_tracker/analytics.py portfolio_tracker/frontier.py portfolio_tracker/symbol_db.py portfolio_tracker/mpt.py portfolio_tracker/xlsx_export.py build_symbol_db.py 2>&1 || true

      # Verify the server module is importable (no top-level import errors).
      - name: Import smoke-test
        run: |
          python -c "import ast; ast.parse(open('dashboard.py').read()); print('dashboard.py shim: parseable')"
          python -c "from portfolio_tracker import mpt" 2>&1 | grep -v "numba\|llvmlite\|NumbaPendingDeprecation" || true

  test:
    name: Metrics unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short
