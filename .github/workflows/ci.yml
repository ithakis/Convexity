name: CI

on:
  push:
    # `distribution`: the v2.0.0 integration branch, until it merges.
    branches: ["main", "claude/**", "distribution"]
  pull_request:
    # `distribution` too, so PRs into the integration branch get CI before merge.
    branches: ["main", "distribution"]

# The repo is public: the default token is read-only, third-party actions are
# pinned to a commit SHA (a moved tag cannot change what runs here), and no
# workflow uses pull_request_target. See CLAUDE.md §18.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: No runtime state or local settings anywhere in history
        run: |
          bad=$(git log --all --pretty=format: --name-only | sort -u | grep -E '(^|/)\.(convexity|portfolio_tracker)_[a-z_]+\.json$|settings\.local\.json$|\.dashboard\.pid$|(^|/)\.(finnhub|nvidia|openrouter)_key$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files in history:"; echo "$bad"; exit 1; fi

  lint:
    name: Syntax & static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # No `uv sync` here: the full yfinance / numba stack is not needed for
      # syntax/manifest checks. --no-project runs on the pinned .python-version
      # interpreter without installing the project.

      # Hard gate: AST parse every Python file. Catches syntax errors that
      # would crash the server on startup. No interpreter quirks — pure grammar.
      - name: Python syntax check (all .py files)
        run: uv run --no-project python scripts/check_syntax.py

      # ruff (config in pyproject.toml) replaced the non-blocking pyflakes
      # step in Phase 7: undefined names, unused imports, etc. now fail CI,
      # and so does unformatted code. Pinned to the version in uv.lock (dev
      # extra) so CI and `uv run ruff` agree; bump both together.
      - name: ruff check
        run: uvx ruff@0.16.9 check .
      - name: ruff format --check
        run: uvx ruff@0.16.9 format --check .

      # The check that would have caught the v1.10.0 bug: two manifests that
      # were never compared, so lightgbm/scikit-learn lived only in the one CI
      # used and every installed copy ran with a dead ML model.
      # envcheck.REQUIRED is the single list; this asserts pyproject.toml covers
      # it (plus the deprecated requirements.txt/environment.yml while they exist).
      - name: Dependency manifests match envcheck.REQUIRED
        run: uv run --no-project python scripts/check_dependency_manifests.py

      # uv.lock must be solved from the current pyproject.toml.
      - name: Lockfile is up to date
        run: uv lock --check

      # packaging/install.ps1 + update.ps1 are a file type this project didn't have
      # before (Windows bootstrap scripts) — CLAUDE.md's own convention says
      # new file types must be added to the syntax-check step, so PowerShell
      # Core (pwsh, preinstalled on ubuntu-latest runners) parses them here.
      - name: PowerShell syntax check (packaging/install.ps1, update.ps1)
        shell: pwsh
        run: |
          $files = "packaging/install.ps1", "packaging/update.ps1"
          $failed = $false
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "PARSE ERRORS in $f`:" -ForegroundColor Red
              $errs | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
              $failed = $true
            } else {
              Write-Host "$f OK"
            }
          }
          if ($failed) { exit 1 }

      - name: Shell syntax check (install.sh, packaging/update.sh, packaging/Launch Dashboard.command)
        run: |
          for f in install.sh packaging/update.sh "packaging/Launch Dashboard.command"; do bash -n "$f" && echo "$f OK"; done

  test:
    name: Metrics unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --locked: install exactly uv.lock; fail if it is stale vs pyproject.toml.
      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short

  server-smoke:
    name: Server smoke test (real HTTP requests, not just imports)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      # Actually starts the HTTP server (same start_server() the browser and
      # desktop apps use) and hits real routes — proves the app boots and
      # serves, not just that the files parse. See scripts/smoke_test_server.py.
      - name: Start server and hit real routes
        run: uv run python scripts/smoke_test_server.py

  desktop-import-smoke:
    name: Desktop app import (PySide6 + QtWebEngine, headless)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked, + desktop extra)
        run: uv sync --locked --extra desktop

      # The bare ubuntu-latest runner has no GPU/graphics stack at all — not
      # even libEGL, which Qt6 needs to construct a QApplication regardless
      # of platform plugin (offscreen still initializes the GL abstraction
      # layer). Without these, `QApplication([])` itself fails with
      # "ImportError: libEGL.so.1: cannot open shared object file" before
      # convexity.desktop is ever imported. Xvfb is NOT needed here
      # (that's for the X11 platform plugin; offscreen avoids that entirely)
      # — only the underlying graphics libraries Qt dlopens.
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxss1 libgbm1
          # libasound2 was renamed libasound2t64 in the Ubuntu 24.04 time_t
          # transition — package name depends on the runner's Ubuntu version,
          # so try both instead of hardcoding one and risking the whole
          # install step failing atomically on an unknown package name.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 \
            || true

      # Qt's "offscreen" platform plugin lets a QApplication (and therefore
      # everything convexity.desktop wires up at import time) be
      # constructed with no real display — no Xvfb needed. This catches
      # import-time breakage in desktop.py (bad PySide6 API usage, missing
      # QtWebEngine sub-modules) that the plain lint job can't, since lint
      # never actually installs PySide6.
      - name: Import convexity.desktop under an offscreen QApplication
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          import convexity.desktop
          print('desktop module import OK under offscreen QApplication')
          "

      # The one-logo tests that re-render assets/icon.svg with QtSvg and
      # compare it with the shipped PNGs. They skip in the `test` job (no
      # PySide6 there), so this is where they actually run.
      - name: Icon PNGs match icon.svg (QtSvg render)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --with pytest pytest tests/test_icon.py -v

  tool-install-smoke:
    name: "uv tool install . + boot and /api/health (what the installers do)"
    runs-on: ubuntu-latest
    needs: [lint, test]

    # The installers do `uv tool install`, which resolves from pyproject.toml's
    # ranges — NOT from uv.lock like every other job here. This is the job that
    # sees what a new user actually gets, and that the installed package (not
    # the checkout) boots: static files and data ship as package data, and user
    # state lands in the data folder, not next to the code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: uv tool install .
        run: uv tool install --python 3.14 .

      - name: Dependency self-check with the tool's interpreter
        run: '"$(uv tool dir)/convexity/bin/python" -m convexity.envcheck'

      - name: Boot the installed `convexity` and hit /api/health
        env:
          CONVEXITY_HOME: ${{ runner.temp }}/convexity-home
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # prove nothing depends on the checkout
          "$(uv tool dir --bin)/convexity" > server.log 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 60); do
            port=$(grep -o 'localhost:[0-9]*' server.log | head -n 1 | cut -d: -f2 || true)
            if [ -n "$port" ] && curl -fsS "http://127.0.0.1:$port/api/health" -o health.json; then ok=1; break; fi
            sleep 2
          done
          kill "$pid" || true
          if [ -z "$ok" ]; then cat server.log; exit 1; fi
          expected=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/src/convexity/__init__.py")
          python3 - "$expected" <<'EOF'
          import json, os, sys
          h = json.load(open("health.json"))
          assert h["version"] == sys.argv[1], (h["version"], sys.argv[1])
          assert h["data_dir"] == os.environ["CONVEXITY_HOME"], h["data_dir"]
          print("installed convexity", h["version"], "healthy; data dir", h["data_dir"])
          EOF

  macos-install-smoke:
    name: "macOS: install.sh end to end (uv tool install, sips/iconutil, .app)"
    runs-on: macos-latest
    needs: [lint, test]

    # The whole installer against this checkout (CONVEXITY_SOURCE), into
    # throwaway locations. Before v1.14 this job ran only the icon commands,
    # because the conda installer took 10-15 minutes; the uv one takes ~2.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run install.sh
        env:
          CONVEXITY_SOURCE: ${{ github.workspace }}
          INSTALL_APPS_DIR: ${{ runner.temp }}/Applications
          INSTALL_DESKTOP_DIR: ""
          CONVEXITY_HOME: ${{ runner.temp }}/convexity-home
        run: bash install.sh < /dev/null

      - name: Verify the .app bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Applications/Convexity.app"
          test -s "$app/Contents/Resources/icon.icns" || { echo "icon.icns missing or empty"; exit 1; }
          launcher="$app/Contents/MacOS/Convexity"
          test -x "$launcher"
          target=$(sed -n 's/^exec "\(.*\)" .*/\1/p' "$launcher")
          test -x "$target" || { echo "launcher target not executable: $target"; exit 1; }
          ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          expected=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/convexity/__init__.py)
          [ "$ver" = "$expected" ] || { echo "bundle version $ver != $expected"; exit 1; }
          echo "Convexity.app OK: v$ver -> $target"

  windows-install-smoke:
    name: "Windows: packaging/install.ps1 end to end (uv tool install, Pillow icon, WScript.Shell shortcuts)"
    runs-on: windows-latest
    needs: [lint, test]

    # The whole installer against this checkout on a disposable runner,
    # including the real Start Menu + Desktop shortcuts. WScript.Shell has no
    # equivalent on macOS/Linux (not even under PowerShell Core), so this is
    # the only place the shortcut code ever runs before a user does.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Windows PowerShell 5.1 (`shell: powershell`), not pwsh 7: the README
      # one-liner runs `powershell`, and 5.1 treats native stderr differently.
      - name: Run install.ps1 (Windows PowerShell 5.1, as the one-liner does)
        shell: powershell
        env:
          CONVEXITY_HOME: ${{ runner.temp }}\convexity-home
        run: .\packaging\install.ps1 -Source .

      - name: Verify shortcuts and icon
        shell: pwsh
        run: |
          $exe = Join-Path (uv tool dir) "convexity\Scripts\convexity-app.exe"
          if (-not (Test-Path $exe)) { throw "convexity-app.exe not found at $exe" }
          $ico = Join-Path $env:LOCALAPPDATA "Convexity\icon.ico"
          if (-not (Test-Path $ico) -or (Get-Item $ico).Length -eq 0) { throw "icon.ico missing or empty" }
          $WshShell = New-Object -ComObject WScript.Shell
          $dirs = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs", [Environment]::GetFolderPath("Desktop"))
          foreach ($d in $dirs) {
            $lnk = Join-Path $d "Convexity.lnk"
            if (-not (Test-Path $lnk)) { throw "shortcut not created: $lnk" }
            $s = $WshShell.CreateShortcut($lnk)
            if ($s.TargetPath -ine $exe) { throw "TargetPath mismatch in ${lnk}: $($s.TargetPath) (expected $exe)" }
            if ($s.IconLocation -notlike "*icon.ico*") { throw "IconLocation mismatch in ${lnk}: $($s.IconLocation)" }
            Write-Host "OK: $lnk -> $($s.TargetPath)"
          }
