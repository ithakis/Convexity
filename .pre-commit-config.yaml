# pre-commit hooks for the Convexity.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files
#
# These hooks mirror the CI checks in .github/workflows/ci.yml so failures
# are caught locally before pushing.

repos:
  # -------------------------------------------------------------------------
  # 1. Python syntax check — hard gate, fast (~0.5s for whole repo)
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python syntax check (ast.parse)
        language: script
        entry: scripts/check_syntax.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # -------------------------------------------------------------------------
  # 2. ruff — lint + format check (config in pyproject.toml), as in CI
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: uv run ruff format --check .
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # -------------------------------------------------------------------------
  # 3. pytest — metrics unit tests
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest-metrics
        name: Metrics unit tests (pytest tests/)
        language: system
        entry: uv run pytest tests/ -q --tb=short
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
