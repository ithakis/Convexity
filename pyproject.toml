# The single dependency manifest (since v1.14; requirements.txt and
# environment.yml are gone).
#
# `dependencies` must cover every entry of src/convexity/envcheck.REQUIRED —
# scripts/check_dependency_manifests.py enforces it in CI. The installers
# (install.sh / install.ps1) `uv tool install` from these ranges, NOT from
# uv.lock; CI's tool-install-smoke job exercises that resolution.
#
# Dev workflow:  uv sync --extra dev --extra desktop
#                uv run convexity        (browser mode)
#                uv run convexity-app    (desktop window)
#                uv run pytest

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "convexity"
dynamic = ["version"]
description = "Local portfolio dashboard: quotes, analytics, news reads and a mean-CVaR optimizer."
readme = "README.md"
# numba/llvmlite are the binding constraint on the upper bound; re-check it
# (and lightgbm / PySide6 wheel coverage) before raising it.
requires-python = ">=3.11,<3.15"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Tsoskounoglou" }]
classifiers = [
    # All rights reserved (see LICENSE): PyPI rejects any upload carrying this.
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=1.0.0",
    "requests>=2.28.0",
    "numba>=0.65",
    # Runtime, not test-only: ml_features assembles scipy.sparse matrices.
    "scipy>=1.10.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "openai>=1.0.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest", "ruff"]
# ml/ training pipeline only. pyarrow stays out on purpose: it switches
# pandas 3's string backing (CLAUDE.md §4).
train = ["duckdb", "flaml"]

[project.scripts]
convexity = "convexity.cli:main"

[project.gui-scripts]
convexity-app = "convexity.desktop:main"

[project.urls]
Repository = "https://github.com/ithakis/Convexity"

[tool.hatch.version]
path = "src/convexity/__init__.py"

# Every non-gitignored file inside the package ships, so static/ and
# data/lm_lexicon.json are package data without further configuration.
[tool.hatch.build.targets.wheel]
packages = ["src/convexity"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# src layout: tests import the package from src/ even without the editable
# install, and `tests.` / `ml.` helpers from the repo root.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# Replaced pyflakes in Phase 7; CI's lint job runs `ruff check` and
# `ruff format --check` as blocking gates.
target-version = "py311"
line-length = 100
src = ["src", "."]
extend-exclude = ["ml/data"]

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E4/E7/E9): ruff's defaults, i.e. what
# pyflakes caught before, plus a handful of real-bug style errors.
select = ["E4", "E7", "E9", "F"]
# `l` / `h` are the lower/upper weight bounds of the mean-CVaR LP (mpt.py and
# its scipy reference), named as in the maths; renaming them would make the
# numba solver harder to check against the paper, not safer.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# server.py installs its warnings filter before importing yfinance-backed
# modules, on purpose; the tests put the repo root on sys.path first.
"src/convexity/server.py" = ["E402"]
"tests/*" = ["E402"]
