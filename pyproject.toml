# The single dependency manifest (since v1.14; requirements.txt and
# environment.yml are gone).
#
# `dependencies` must cover every entry of src/convexity/envcheck.REQUIRED —
# scripts/check_dependency_manifests.py enforces it in CI. The installers
# (install.sh / install.ps1) `uv tool install` from these ranges, NOT from
# uv.lock; CI's tool-install-smoke job exercises that resolution.
#
# Dev workflow:  uv sync --extra dev --extra desktop
#                uv run convexity        (browser mode)
#                uv run convexity-app    (desktop window)
#                uv run pytest

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "convexity"
dynamic = ["version"]
description = "Local portfolio dashboard: quotes, analytics, news reads and a mean-CVaR optimizer."
readme = "README.md"
# numba/llvmlite are the binding constraint on the upper bound; re-check it
# (and lightgbm / PySide6 wheel coverage) before raising it.
requires-python = ">=3.11,<3.15"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Tsoskounoglou" }]
classifiers = [
    # All rights reserved (see LICENSE): PyPI rejects any upload carrying this.
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=1.0.0",
    "requests>=2.28.0",
    "numba>=0.65",
    # Runtime, not test-only: ml_features assembles scipy.sparse matrices.
    "scipy>=1.10.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "openai>=1.0.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest", "ruff", "pyflakes"]
# ml/ training pipeline only. pyarrow stays out on purpose: it switches
# pandas 3's string backing (CLAUDE.md §4).
train = ["duckdb", "flaml"]

[project.scripts]
convexity = "convexity.server:main"

[project.gui-scripts]
convexity-app = "convexity.desktop:main"

[project.urls]
Repository = "https://github.com/ithakis/Convexity"

[tool.hatch.version]
path = "src/convexity/__init__.py"

# Every non-gitignored file inside the package ships, so static/ and
# data/lm_lexicon.json are package data without further configuration.
[tool.hatch.build.targets.wheel]
packages = ["src/convexity"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# src layout: tests import the package from src/ even without the editable
# install, and `tests.` / `ml.` helpers from the repo root.
pythonpath = ["src", "."]
testpaths = ["tests"]
