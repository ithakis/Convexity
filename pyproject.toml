# The single dependency manifest (since v1.14; requirements.txt and
# environment.yml are gone).
#
# `dependencies` must cover every entry of src/convexity/envcheck.REQUIRED —
# scripts/check_dependency_manifests.py enforces it in CI. The installers
# (install.sh / install.ps1) `uv tool install` from these ranges, NOT from
# uv.lock; CI's tool-install-smoke job exercises that resolution.
#
# Dev workflow:  uv sync --extra dev --extra desktop
#                uv run convexity        (browser mode)
#                uv run convexity-app    (desktop window)
#                uv run pytest

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "convexity"
dynamic = ["version"]
description = "Local portfolio dashboard: quotes, analytics, news reads and a mean-CVaR optimizer."
readme = "README.md"
# 3.14 is the only supported interpreter (the installers fetch it through uv).
# numba/llvmlite are the binding constraint on the upper bound; re-check it
# (and lightgbm / PySide6 wheel coverage) before raising it.
requires-python = ">=3.14,<3.15"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Tsoskounoglou" }]
classifiers = [
    # All rights reserved (see LICENSE): PyPI rejects any upload carrying this.
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=1.0.0",
    "requests>=2.28.0",
    "numba>=0.65",
    # Runtime, not test-only: ml_features assembles scipy.sparse matrices.
    "scipy>=1.10.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "openai>=1.0.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    # My Investments import: PDF statements (text, and scanned pages as images).
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest", "ruff"]
# ml/ training pipeline only. pyarrow stays out on purpose: it switches
# pandas 3's string backing (CLAUDE.md §4).
train = ["duckdb", "flaml"]

[project.scripts]
convexity = "convexity.cli:main"

[project.gui-scripts]
convexity-app = "convexity.desktop:main"

[project.urls]
Repository = "https://github.com/ithakis/Convexity"

[tool.hatch.version]
path = "src/convexity/__init__.py"

# Every non-gitignored file inside the package ships, so static/ and
# data/lm_lexicon.json are package data without further configuration.
[tool.hatch.build.targets.wheel]
packages = ["src/convexity"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# src layout: tests import the package from src/ even without the editable
# install, and `tests.` / `ml.` helpers from the repo root.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# Replaced pyflakes in Phase 7; CI's lint job runs `ruff check` and
# `ruff format --check` as blocking gates.
# py313, not py314, on purpose: at py314 `ruff format` rewrites
# `except (A, B):` to PEP 758's bare `except A, B:`, which is valid 3.14 but
# reads as Python 2 to people and to the pre-commit reviewer. The one cost:
# forward references in annotations stay quoted ("Job"), since py313 assumes
# eager evaluation where 3.14 (PEP 649) is lazy.
target-version = "py313"
line-length = 100
src = ["src", "."]
extend-exclude = ["ml/data"]

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E4/E7/E9): ruff's defaults, i.e. what
# pyflakes caught before, plus a handful of real-bug style errors. UP, C4,
# PIE, SIM and FURB (v2.0, issue #17) keep the code on current idioms for the
# pinned interpreter: `X | None`, `datetime.UTC`, no
# `from __future__ import annotations` (PEP 649 makes it redundant).
select = ["E4", "E7", "E9", "F", "UP", "C4", "PIE", "SIM", "FURB"]
ignore = [
    # `l` / `h` are the lower/upper weight bounds of the mean-CVaR LP (mpt.py
    # and its scipy reference), named as in the maths; renaming them would
    # make the numba solver harder to check against the paper, not safer.
    "E741",
    "SIM103", # `return not (a or b)` reads worse than the explicit branches
    "SIM112", # macOS sets `__CFBundleIdentifier` in exactly that case
    "SIM113", # a `done` counter that only counts yielded rows is clearer
    "SIM115", # tarfile.open is split from its `with` to map its errors
    "SIM300", # flags `T >= h` as a Yoda condition: `T` is a variable, not a constant
]

[tool.ruff.lint.per-file-ignores]
# server.py installs its warnings filter before importing yfinance-backed
# modules, on purpose; the tests put the repo root on sys.path first.
"src/convexity/server.py" = ["E402"]
"tests/*" = ["E402"]
